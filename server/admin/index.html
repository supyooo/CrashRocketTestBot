<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Crash Rocket · Админка</title>
<style>
  /* layout: a top bar (period, server, search), then the dashboard grid or the player card */
  :root{color-scheme:dark;--bg:#0f0b22;--panel:#171334;--panel2:#1f1a44;--line:#2f2a5c;--text:#f3f1ff;--muted:#9a97c4;
    --green:#2bff88;--red:#ff4d6d;--gold:#ffd23f;--cyan:#29e6ff;--violet:#b06bff;
    --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--mono:ui-monospace,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--body)}
  button,input,select{font:inherit;color:inherit}
  a{color:var(--cyan);text-decoration:none}a:hover{text-decoration:underline}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;flex-wrap:wrap;gap:10px;padding:10px 20px;background:rgba(15,11,34,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
  .brand{font-weight:800;letter-spacing:.02em;margin-right:6px}
  .seg{display:flex;gap:3px;padding:3px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
  .seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;color:var(--muted);cursor:pointer;font-weight:600}
  .seg button[aria-pressed=true]{background:var(--panel2);color:var(--text)}
  .pill{display:flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-variant-numeric:tabular-nums}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.dot.on{background:var(--green)}
  .sp{flex:1}
  .search{display:flex;gap:6px}
  .search input{width:240px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
  .btn{padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:600;cursor:pointer}
  .btn:hover{border-color:var(--muted)}
  .btn.g{border-color:var(--green);color:var(--green)}.btn.r{border-color:var(--red);color:var(--red)}.btn.y{border-color:var(--gold);color:var(--gold)}
  .btn.sm{padding:3px 10px;font-size:12.5px;border-radius:8px}
  main{padding:20px;max-width:1400px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0;display:flex;flex-direction:column;gap:12px}
  .card h2{margin:0;font-size:15px;color:var(--gold)}
  .c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
  @media (max-width:1000px){.c8,.c4,.c6{grid-column:span 12}}
  .kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  .kgrp{background:var(--panel2);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
  .kgrp b{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .kv{display:flex;justify-content:space-between;gap:10px}.kv span{color:var(--muted)}.kv em{font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  canvas{width:100%;height:150px;display:block}
  table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .tbl{overflow-x:auto}
  .mono{font-family:var(--mono);font-size:12.5px}
  .muted{color:var(--muted)}
  .empty{color:var(--muted);padding:8px 0}
  .chip{display:inline-block;padding:2px 8px;border-radius:7px;font-size:12px;font-weight:700;background:var(--panel2);color:var(--muted)}
  .chip.ok{color:var(--green);background:rgba(43,255,136,.1)}.chip.bad{color:var(--red);background:rgba(255,77,109,.12)}.chip.warn{color:var(--gold);background:rgba(255,210,63,.12)}.chip.info{color:var(--cyan);background:rgba(41,230,255,.1)}
  .alert{padding:9px 12px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .alert .t{flex:1;min-width:0}
  .who{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .ava{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--violet);font-size:26px;font-weight:800;flex:none}
  .who h1{margin:0;font-size:22px}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  @media (max-width:800px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .stat{background:var(--panel2);border-radius:12px;padding:10px 12px;min-width:0}
  .stat span{display:block;font-size:12px;color:var(--muted)}.stat b{font-size:17px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tabs button{padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-weight:600;cursor:pointer}
  .tabs button[aria-pressed=true]{color:var(--text);border-color:var(--gold)}
  .log{display:flex;flex-direction:column;gap:8px;max-height:620px;overflow:auto}
  .li{padding:8px 10px;border-radius:10px;background:var(--panel2)}
  .li small{display:block;color:var(--muted)}
  .login{max-width:380px;margin:12vh auto;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
  .login input{padding:8px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
  .err{color:var(--red)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.on{opacity:1}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" role="status"></div>
<script src="/admin/admin.js"></script>
</body>
</html>
