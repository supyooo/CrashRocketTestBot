<style>
:root{color-scheme:dark;
  --page:#0d0820;--ink:#ecebf5;--ink-2:#9490b3;--hair:#262143;
  --bg:#12092a;--panel:#161a2f;--panel-2:#1f2440;--line:#2b3155;--text:#f3f1ff;--muted:#8f93b8;
  --green:#2bff88;--gold:#ffd23f;--pink:#ff3ea5;--cyan:#29e6ff;--red:#ff3b6b;--violet:#8a5cff;
  --heat:#eafff3;--heat-glow:rgba(43,255,136,.75)}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 'Golos Text',system-ui,sans-serif}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* ---------- shell (desktop shows a phone frame; phones and Telegram go full-bleed) ---------- */
.shell{height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.device{height:min(844px,calc(100vh - 48px));aspect-ratio:390/844;max-width:100%;border-radius:52px;padding:12px;background:#1b1a22;box-shadow:0 0 0 1px #2c2a36,0 40px 80px -20px #000;flex:none}
.device>.app{border-radius:40px}
@media (max-width:760px){
  .shell{padding:0;align-items:stretch}
  .device{flex:1;min-height:0;height:auto;aspect-ratio:auto;border-radius:0;padding:0;background:none;box-shadow:none}
  .device>.app{border-radius:0}
}
html.tg .shell{padding:0;align-items:stretch}
html.tg .device{flex:1;height:auto;aspect-ratio:auto;border-radius:0;padding:0;background:none;box-shadow:none}
html.tg .device>.app{border-radius:0}

/* ---------- app ---------- */
.app{position:relative;height:100%;width:100%;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--text);container-type:inline-size}
.top{display:flex;align-items:center;gap:8px;padding:calc(10px + max(env(safe-area-inset-top,0px),var(--tg-safe-area-inset-top,0px)) + var(--tg-content-safe-area-inset-top,0px)) 12px 8px;position:relative;z-index:3}
.bal{display:flex;align-items:center;gap:8px;height:40px;padding:0 6px 0 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-variant-numeric:tabular-nums;transition:transform .15s,border-color .3s}
.bal.bump{transform:scale(1.08);border-color:var(--gold)}
.bal .plus{width:28px;height:28px;border-radius:50%;border:0;background:var(--green);color:#0b1a12;font-weight:800;font-size:18px;line-height:1;display:grid;place-items:center}
.ton{width:18px;height:18px;flex:none}
.sp{flex:1}
.ib{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--muted)}
.ib svg{width:18px;height:18px}
.ib[aria-pressed="true"]{color:var(--green)}
.lang{display:flex;height:36px;padding:3px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
.lang button{border:0;background:transparent;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--panel-2);color:var(--text)}
.hist{display:flex;gap:6px;padding:0 12px 8px;overflow:hidden;position:relative;z-index:3;-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent)}
.chip{flex:none;height:26px;padding:0 10px;border-radius:9px;display:grid;place-items:center;font:700 12px/1 'Unbounded',sans-serif;font-variant-numeric:tabular-nums;border:1px solid currentColor;background:color-mix(in srgb,currentColor 12%,transparent)}
.chip.lo{color:var(--red)}.chip.mid{color:var(--cyan)}.chip.hi{color:var(--gold)}
.chip.new{animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.5);opacity:0}}

.stage{position:relative;flex:1;min-height:170px;overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;align-items:center;padding-top:5%;z-index:2}
.online{position:absolute;left:12px;top:8px;display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--muted);z-index:2;font-variant-numeric:tabular-nums}
.online i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.mult{font:800 clamp(52px,17cqw,76px)/1 'Unbounded','Golos Text',sans-serif;color:var(--heat);text-shadow:0 0 18px var(--heat-glow),0 0 44px var(--heat-glow);font-variant-numeric:tabular-nums;letter-spacing:-.02em;will-change:transform}
.mult.waiting{opacity:.3;text-shadow:none}
.mult.crashed{color:var(--red);text-shadow:0 0 22px rgba(255,59,107,.7)}
.mult.punch{animation:punch .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes punch{0%{transform:scale(1.28)}100%{transform:scale(1)}}
.mult.glitch{animation:glitch .55s steps(2) 1}
@keyframes glitch{0%{transform:translate(0)}15%{transform:translate(-6px,2px);text-shadow:4px 0 #29e6ff,-4px 0 #ff3ea5}30%{transform:translate(5px,-3px);text-shadow:-5px 0 #29e6ff,5px 0 #ff3ea5}45%{transform:translate(-3px,1px) skewX(8deg)}60%{transform:translate(4px,0) skewX(-6deg);text-shadow:3px 0 #29e6ff,-3px 0 #ff3ea5}80%{transform:translate(-1px,1px)}100%{transform:none}}
.sub{margin-top:8px;font-size:13px;font-weight:600;opacity:.85;font-variant-numeric:tabular-nums;text-align:center;padding:0 16px}
.count{position:absolute;left:0;right:0;top:34%;text-align:center;font:900 64px/1 'Unbounded',sans-serif;color:#fff;text-shadow:0 0 30px rgba(255,62,165,.9);pointer-events:none;opacity:0;z-index:2}
.count.on{animation:cnt .9s ease-out forwards}
.count.go{color:var(--gold);font-size:44px;text-shadow:0 0 30px rgba(255,210,63,.9)}
@keyframes cnt{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(.85)}}

.vig{position:absolute;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity .5s;box-shadow:inset 0 0 90px 20px var(--vig,rgba(255,59,107,.8))}
.vig.on{opacity:1;transition:opacity .08s}

.win{position:absolute;left:50%;bottom:14px;z-index:4;transform:translate(-50%,30px) scale(.7);opacity:0;pointer-events:none;min-width:210px;padding:12px 22px 14px;border-radius:18px;text-align:center;background:linear-gradient(180deg,rgba(26,20,58,.94),rgba(14,10,34,.94));border:1.5px solid var(--gold);box-shadow:0 0 30px rgba(255,210,63,.35),0 12px 30px rgba(0,0,0,.5)}
.win.on{animation:winIn 2.4s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes winIn{0%{opacity:0;transform:translate(-50%,30px) scale(.7)}14%{opacity:1;transform:translate(-50%,0) scale(1.05)}22%{transform:translate(-50%,0) scale(1)}85%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-10px) scale(.96)}}
.win small{display:block;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.win b{display:block;margin-top:2px;font:800 30px/1.1 'Unbounded',sans-serif;color:#fff;text-shadow:0 0 16px rgba(255,210,63,.6);font-variant-numeric:tabular-nums}
.win span{display:block;margin-top:2px;font-size:12.5px;font-weight:600;color:var(--muted)}
.rays{position:absolute;inset:-40%;z-index:0;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg,rgba(255,210,63,.18) 0deg 9deg,transparent 9deg 22deg);-webkit-mask-image:radial-gradient(circle,#000 10%,transparent 60%);mask-image:radial-gradient(circle,#000 10%,transparent 60%)}
.rays.on{animation:rays 3s ease-out forwards}
@keyframes rays{0%{opacity:0;transform:rotate(0) scale(.6)}15%{opacity:1}80%{opacity:.8}100%{opacity:0;transform:rotate(60deg) scale(1.1)}}
.bigwin{position:absolute;left:0;right:0;top:30%;z-index:3;text-align:center;pointer-events:none;opacity:0;font:900 clamp(30px,11cqw,44px)/1 'Unbounded',sans-serif;letter-spacing:-.01em;color:var(--gold);-webkit-text-stroke:2px #3a1b00;paint-order:stroke fill;text-shadow:0 4px 0 #b8581a,0 0 34px rgba(255,210,63,.8)}
.bigwin.on{animation:big 2.6s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes big{0%{opacity:0;transform:scale(.2) rotate(-12deg)}14%{opacity:1;transform:scale(1.12) rotate(-4deg)}22%{transform:scale(1) rotate(-4deg)}82%{opacity:1}100%{opacity:0;transform:scale(1.2) rotate(-4deg)}}
.stamp{position:absolute;left:50%;top:40%;z-index:4;pointer-events:none;opacity:0;padding:8px 18px;border:4px solid var(--red);border-radius:10px;font:900 clamp(26px,9cqw,36px)/1 'Unbounded',sans-serif;letter-spacing:.02em;color:var(--red);text-shadow:0 0 14px rgba(255,59,107,.6);background:rgba(20,4,12,.35);transform:translate(-50%,-50%) rotate(-9deg)}
.stamp.on{animation:stamp 2.2s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(2.6)}12%{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(.94)}20%{transform:translate(-50%,-50%) rotate(-9deg) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(1)}}
.safe{position:absolute;left:50%;top:44%;z-index:4;transform:translateX(-50%);pointer-events:none;opacity:0;padding:7px 14px;border-radius:99px;background:rgba(43,255,136,.14);border:1px solid var(--green);color:var(--green);font-weight:800;font-size:13px;white-space:nowrap}
.safe.on{animation:fadeUp 2.2s ease forwards}
@keyframes fadeUp{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}

.toast{position:absolute;left:50%;top:44px;transform:translate(-50%,-8px);opacity:0;transition:.25s;padding:8px 14px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap;background:var(--panel);border:1px solid var(--line);z-index:5;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--red);border-color:transparent;color:#fff}

.panel{position:relative;z-index:3;margin:0 10px;padding:8px;border-radius:18px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:6px}
.amt{flex:1;display:flex;align-items:center;height:42px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden}
.amt button{width:40px;height:100%;border:0;background:transparent;font-size:20px;font-weight:600;color:var(--muted)}
.amt label{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.amt input{width:64px;border:0;background:transparent;text-align:right;font:700 17px 'Unbounded',sans-serif;font-variant-numeric:tabular-nums;outline:none}
.amt .ton{width:16px;height:16px}
.mini{min-width:44px;height:42px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-weight:700;font-size:13px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.quick button{height:28px;border-radius:10px;border:1px solid var(--line);background:transparent;font-weight:700;font-size:12.5px;color:var(--muted)}
.auto{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;color:var(--muted)}
.sw-t{position:relative;width:38px;height:22px;flex:none}
.sw-t input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.sw-t span{position:absolute;inset:0;border-radius:99px;background:var(--panel-2);border:1px solid var(--line);transition:.2s;pointer-events:none}
.sw-t span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:.2s}
.sw-t input:checked+span{background:var(--green);border-color:var(--green)}
.sw-t input:checked+span::after{left:18px;background:var(--bg)}
.sw-t input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.auto .x{margin-left:auto;display:flex;align-items:center;height:30px;padding:0 10px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line)}
.auto .x input{width:44px;border:0;background:transparent;text-align:right;font:700 13px 'Unbounded',sans-serif;outline:none}
.auto .x b{font:700 13px 'Unbounded',sans-serif;color:var(--muted)}
.auto.off .x{opacity:.45}
.main{position:relative;height:56px;border:0;border-radius:14px;background:var(--gold);color:#1a1204;box-shadow:0 5px 0 #b8901a;margin-bottom:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:transform .08s,box-shadow .08s}
.main:active{transform:translateY(3px);box-shadow:0 2px 0 #b8901a}
.main b{font:700 15px/1.1 'Unbounded',sans-serif;text-transform:uppercase}
.main small{font-size:12px;font-weight:700;opacity:.75;font-variant-numeric:tabular-nums}
.main.cash{background:var(--green);color:#04150d;box-shadow:0 5px 0 #0f9a50;animation:pulse 1s ease-in-out infinite}
.main.cancel{background:var(--panel-2);color:var(--text);box-shadow:0 5px 0 var(--line)}
@keyframes pulse{50%{filter:brightness(1.15)}}

.players{position:relative;z-index:3;margin:8px 10px 0;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.ph{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;font-weight:600;padding:0 4px 2px;font-variant-numeric:tabular-nums}
.pl{display:grid;grid-template-columns:22px 1fr auto 64px;align-items:center;gap:8px;height:28px;padding:0 8px;border-radius:10px;background:var(--panel);border:1px solid transparent;font-variant-numeric:tabular-nums}
.pl .av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:800;color:#fff}
.pl .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pl .b{color:var(--muted);font-weight:600}
.pl .r{text-align:right;font-weight:700;color:var(--muted)}
.pl.won{border-color:rgba(43,255,136,.45);background:rgba(43,255,136,.08)}
.pl.won .r{color:var(--green)}
.pl.lost .r{color:var(--red)}
.pl.me .n{color:var(--gold)}
.tabs{position:relative;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + max(env(safe-area-inset-bottom,0px),var(--tg-safe-area-inset-bottom,0px)));margin-top:8px;border-top:1px solid var(--line);background:var(--bg)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="page"]{color:var(--green)}
@media (max-height:700px){.players{display:none}.quick{display:none}}

#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* ---------- hangar sheet ---------- */
.scrim{position:absolute;inset:0;z-index:7;background:rgba(5,2,15,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;max-height:78%;display:flex;flex-direction:column;border-radius:24px 24px 0 0;background:#141029;border-top:1px solid #3a3266;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:none}
.sh-h{display:flex;align-items:center;padding:14px 16px 6px}
.sh-h h2{margin:0;font:800 18px 'Unbounded',sans-serif;flex:1}
.sh-h button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-size:18px;line-height:1}
.segs{display:flex;gap:4px;margin:6px 16px 10px;padding:3px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.segs button{flex:1;height:34px;border:0;border-radius:9px;background:transparent;font-weight:700;font-size:13px;color:var(--muted)}
.segs button[aria-selected="true"]{background:var(--panel-2);color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 16px;overflow-y:auto}
.card{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px 6px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);text-align:center}
.card canvas{width:100%;aspect-ratio:3/4;border-radius:10px;background:#0c0820;display:block}
.card b{font-size:12px;font-weight:700;line-height:1.2}
.card i{font-style:normal;font-size:11px;font-weight:700;padding:4px 0;border-radius:8px;background:var(--panel-2);color:var(--muted)}
.card[aria-pressed="true"]{border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,210,63,.15)}
.card[aria-pressed="true"] i{background:var(--gold);color:#1a1204}
@media (prefers-reduced-motion:reduce){.main.cash{animation:none}.mult.punch,.mult.glitch{animation:none}}
</style>

<div class="shell">
  <div class="device">
    <div class="app" id="app">
      <header class="top">
        <div class="bal" id="balBox">
          <svg class="ton" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#0098ea"/><path d="M7.2 7.5h9.6c.7 0 1.1.8.8 1.4L12.6 17c-.3.5-.9.5-1.2 0L6.4 8.9c-.3-.6.1-1.4.8-1.4zm4.1 1.3H8.3l3 5.4V8.8zm1.4 0v5.4l3-5.4h-3z" fill="#fff"/></svg>

            <button id="inc" aria-label="+">+</button>
          </div>
          <button class="mini" id="half">½</button><button class="mini" id="dbl">×2</button>
        </div>

 ru:{gChar:'Персонаж',gRocket:'Ракета',gBg:'Фон',

let lang='ru';try{lang=localStorage.getItem('cr.lang')||'ru'}catch(e){}
const T=k=>I18N[lang][k];
const fmtInt=n=>n.toLocaleString(lang==='ru'?'ru-RU':'en-US');
const fmtTon=n=>n.toLocaleString(lang==='ru'?'ru-RU':'en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const x2=m=>m.toFixed(2);
const rnd=(a,b)=>a+Math.random()*(b-a),lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const easeBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

/* =====================================================================
   Characters — drawn upright, origin at the seat, ~52 units tall
   mood 0..1 (calm → ecstatic), t = time
   ===================================================================== */
function suit(c,col,mood,t,tieCol,lapel){
  c.fillStyle=col;rr(c,-11,-24,22,25,7);c.fill();
  if(lapel){c.fillStyle='#f4f4f8';c.beginPath();c.moveTo(-5,-24);c.lineTo(0,-13);c.lineTo(5,-24);c.fill()}
  c.save();c.translate(0,-21.5);c.rotate(.25+mood*1.05+Math.sin(t*26)*.14*(.3+mood));
  c.fillStyle=tieCol;c.beginPath();c.moveTo(-1.8,0);c.lineTo(1.8,0);c.lineTo(2.9,9);c.lineTo(0,12.5);c.lineTo(-2.9,9);c.closePath();c.fill();c.restore();
}
function arms(c,col,paw,mood,t){
  c.lineCap='round';c.lineWidth=6;c.strokeStyle=col;
  c.beginPath();c.moveTo(8,-18);c.lineTo(15,-7);c.stroke();c.fillStyle=paw;c.beginPath();c.arc(15,-6,3.6,0,6.283);c.fill();
  const up=clamp((mood-.45)/.4,0,1),wave=Math.sin(t*14)*.35*up;
  const ex=lerp(-13,-17,up),ey=lerp(-6,-38,up)+wave*6;
  c.strokeStyle=col;c.beginPath();c.moveTo(-8,-18);c.lineTo(ex,ey);c.stroke();c.fillStyle=paw;c.beginPath();c.arc(ex,ey-1,3.6,0,6.283);c.fill();
}
function mouth(c,x,y,mood){
  if(mood<.3){c.strokeStyle='#1b1010';c.lineWidth=1.3;c.beginPath();c.arc(x,y-1,2.8,.25,2.9);c.stroke();return}
  c.fillStyle='#3a0d12';c.beginPath();c.ellipse(x,y,2.4+mood*1.8,1.1+mood*2.6,0,0,6.283);c.fill();
  c.fillStyle='#ff7a9a';c.beginPath();c.ellipse(x,y+mood*1.4,1.6+mood,1+mood*.8,0,0,Math.PI);c.fill();
}
function shades(c,x,y,rim){c.fillStyle='#0b1a14';c.strokeStyle=rim;c.lineWidth=1.3;rr(c,x-10,y,8.5,5.5,2);c.fill();c.stroke();rr(c,x+1.5,y,8.5,5.5,2);c.fill();c.stroke();
  c.beginPath();c.moveTo(x-1.5,y+2);c.lineTo(x+1.5,y+2);c.stroke();c.fillStyle='rgba(255,255,255,.55)';c.fillRect(x-8,y+1,2.4,1.2);c.fillRect(x+3.5,y+1,2.4,1.2)}
function drawBear(c,mood,t){
  suit(c,'#1c2447',mood,t,'#e8364f',true);arms(c,'#1c2447','#8a5a33',mood,t);
  const hb=Math.sin(t*9)*mood*1.2;c.save();c.translate(0,hb);
  const ew=Math.sin(t*22)*mood*.25;
  [[-9,-45,-ew],[9,-45,ew]].forEach(([x,y,r])=>{c.save();c.translate(x,y);c.rotate(r);c.fillStyle='#8a5a33';c.beginPath();c.arc(0,0,5.2,0,6.283);c.fill();c.fillStyle='#c9925f';c.beginPath();c.arc(0,0,2.6,0,6.283);c.fill();c.restore()});
  c.fillStyle='#8a5a33';c.beginPath();c.arc(0,-35,12.5,0,6.283);c.fill();
  c.fillStyle='#e0b27f';c.beginPath();c.ellipse(2,-30,7.2,5.6,0,0,6.283);c.fill();
  c.fillStyle='#1b1010';c.beginPath();c.ellipse(3,-33,2.7,1.9,0,0,6.283);c.fill();
  mouth(c,3,-28.6,mood);shades(c,0,-41.5,'#2bff88');c.restore();
}
function drawBull(c,mood,t){
  suit(c,'#15151f',mood,t,'#2bff88',true);
  c.strokeStyle='#ffd23f';c.lineWidth=1.6;c.setLineDash([2,1.5]);c.beginPath();c.arc(0,-24,7,.3,Math.PI-.3);c.stroke();c.setLineDash([]);
  arms(c,'#15151f','#5b3a29',mood,t);
  const hb=Math.sin(t*9)*mood*1.2;c.save();c.translate(0,hb);
  c.strokeStyle='#f1e6c8';c.lineCap='round';c.lineWidth=4.2;
  c.beginPath();c.moveTo(-8,-43);c.quadraticCurveTo(-19,-44,-18,-56);c.stroke();c.beginPath();c.moveTo(8,-43);c.quadraticCurveTo(19,-44,18,-56);c.stroke();
  c.fillStyle='#5b3a29';[[-13,-38,-.5],[13,-38,.5]].forEach(([x,y,r])=>{c.beginPath();c.ellipse(x,y,5,2.6,r,0,6.283);c.fill()});
  c.beginPath();c.ellipse(0,-35,12,12.5,0,0,6.283);c.fill();
  c.fillStyle='#fff';c.beginPath();c.ellipse(-4.5,-38,2.8,2.4,0,0,6.283);c.ellipse(4.5,-38,2.8,2.4,0,0,6.283);c.fill();
  c.fillStyle='#1b1010';c.beginPath();c.arc(-3.8,-37.6,1.3,0,6.283);c.arc(5.2,-37.6,1.3,0,6.283);c.fill();
  c.strokeStyle='#1b1010';c.lineWidth=1.8;c.beginPath();c.moveTo(-8,-43);c.lineTo(-2,-40.5);c.moveTo(8,-43);c.lineTo(2,-40.5);c.stroke();
  c.fillStyle='#d49b75';c.beginPath();c.ellipse(1,-28.5,8.5,6,0,0,6.283);c.fill();
  c.fillStyle='#3a1f14';c.beginPath();c.ellipse(-2.5,-29.5,1.5,1.1,0,0,6.283);c.ellipse(4.5,-29.5,1.5,1.1,0,0,6.283);c.fill();
  c.strokeStyle='#ffd23f';c.lineWidth=1.6;c.beginPath();c.arc(1,-25.5,3,0,Math.PI);c.stroke();
  if(mood>.35){c.fillStyle='rgba(255,255,255,.7)';for(let i=0;i<2;i++){const k=((t*2.4)+i*.5)%1;c.globalAlpha=(1-k)*.8;c.beginPath();c.arc(-8-k*9,-28+k*3,1.5+k*3,0,6.283);c.fill()}c.globalAlpha=1}
  c.restore();
}
function drawWhale(c,mood,t){
  const hb=Math.sin(t*9)*mood*1.2;c.save();c.translate(0,hb);
  c.fillStyle='#2f6fe0';c.save();c.translate(-13,-8);c.rotate(-.5+Math.sin(t*10)*.15*(.3+mood));c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-9,-4,-14,-14);c.quadraticCurveTo(-8,-12,-5,-9);c.quadraticCurveTo(-5,-16,-2,-20);c.quadraticCurveTo(2,-10,3,-3);c.closePath();c.fill();c.restore();
  const g=c.createLinearGradient(0,-40,0,0);g.addColorStop(0,'#4f94ff');g.addColorStop(1,'#2458c9');c.fillStyle=g;
  c.beginPath();c.moveTo(-15,0);c.bezierCurveTo(-19,-22,-10,-40,4,-40);c.bezierCurveTo(16,-40,19,-24,17,-8);c.quadraticCurveTo(16,0,8,0);c.closePath();c.fill();
  c.fillStyle='#cfe3ff';c.beginPath();c.moveTo(-4,0);c.bezierCurveTo(-4,-10,4,-18,16,-18);c.quadraticCurveTo(17,-6,8,0);c.closePath();c.fill();
  c.strokeStyle='rgba(36,88,201,.45)';c.lineWidth=.9;for(let i=0;i<3;i++){c.beginPath();c.moveTo(0+i*3,-2);c.quadraticCurveTo(6+i*2,-9,15,-12+i*2);c.stroke()}
  c.fillStyle='#e8364f';c.beginPath();c.moveTo(3,-19);c.lineTo(-1,-22);c.lineTo(-1,-16);c.closePath();c.moveTo(3,-19);c.lineTo(7,-22);c.lineTo(7,-16);c.closePath();c.fill();c.beginPath();c.arc(3,-19,1.4,0,6.283);c.fill();
  c.save();c.translate(13,-10);c.rotate(.6+Math.sin(t*12)*.2*mood);c.fillStyle='#2458c9';c.beginPath();c.ellipse(0,0,6,3,0,0,6.283);c.fill();c.restore();
  c.fillStyle='#0b1a14';c.strokeStyle='#29e6ff';c.lineWidth=1.3;rr(c,-2,-33,18,6,3);c.fill();c.stroke();c.fillStyle='rgba(255,255,255,.55)';c.fillRect(1,-32,3,1.4);
  if(mood<.3){c.strokeStyle='#123a86';c.lineWidth=1.4;c.beginPath();c.moveTo(4,-24);c.quadraticCurveTo(10,-21,16,-24);c.stroke()}
  else{c.fillStyle='#10245a';c.beginPath();c.moveTo(4,-24.5);c.quadraticCurveTo(10,-19+mood*-1-mood*3,16.5,-24.5);c.quadraticCurveTo(10,-23,4,-24.5);c.fill()}
  if(mood>.3){c.strokeStyle='#8fd8ff';c.lineWidth=1.6;c.lineCap='round';const h=6+mood*10+Math.sin(t*18)*2;
    for(const s of[-1,0,1]){c.beginPath();c.moveTo(3,-40);c.quadraticCurveTo(3+s*3,-40-h,3+s*(5+mood*4),-40-h*.6);c.stroke()}
    c.fillStyle='#8fd8ff';for(let i=0;i<3;i++){const k=(t*1.8+i/3)%1;c.globalAlpha=1-k;c.beginPath();c.arc(3+(i-1)*(6+k*6),-40-h*.6+k*10,1.5,0,6.283);c.fill()}c.globalAlpha=1}
  c.restore();
}
const CHARS={
  bear:{ru:'Медведь',en:'Bear',draw:drawBear,drop:'shades'},
  bull:{ru:'Бык',en:'Bull',draw:drawBull,drop:'horn'},
  whale:{ru:'Кит',en:'Whale',draw:drawWhale,drop:'shades'}

/* =====================================================================
   Rockets — local +x is the nose. Rider seat + nozzle x.
   ===================================================================== */
function drawCandle(c){
  c.fillStyle='#7b3cff';c.beginPath();c.moveTo(-46,-12);c.lineTo(-63,-28);c.lineTo(-30,-12);c.fill();c.beginPath();c.moveTo(-46,12);c.lineTo(-63,28);c.lineTo(-30,12);c.fill();
  c.fillStyle='#2a2f45';c.fillRect(-57,-8,8,16);
  const g=c.createLinearGradient(0,-12,0,12);g.addColorStop(0,'#7dffbe');g.addColorStop(.5,'#16c865');g.addColorStop(1,'#06793a');c.fillStyle=g;rr(c,-50,-12,92,24,6);c.fill();
  c.strokeStyle='rgba(200,255,225,.55)';c.lineWidth=1;c.stroke();
  c.fillStyle='#1eea78';c.beginPath();c.moveTo(41,-12);c.quadraticCurveTo(58,-6,66,0);c.quadraticCurveTo(58,6,41,12);c.fill();
  c.strokeStyle='#b9ffd9';c.lineWidth=1.6;c.beginPath();c.moveTo(66,0);c.lineTo(78,0);c.stroke();
  c.fillStyle='rgba(255,255,255,.35)';rr(c,-44,-8.5,78,3,1.5);c.fill();
  c.strokeStyle='rgba(255,255,255,.75)';c.lineWidth=1.6;c.beginPath();c.moveTo(-36,6);c.lineTo(-24,1);c.lineTo(-16,4);c.lineTo(-2,-3);c.lineTo(8,0);c.lineTo(22,-6);c.stroke();
}
function retroBody(c){c.beginPath();c.moveTo(-50,-14);c.lineTo(28,-14);c.quadraticCurveTo(62,-11,72,0);c.quadraticCurveTo(62,11,28,14);c.lineTo(-50,14);c.quadraticCurveTo(-55,0,-50,-14);c.closePath()}
function drawRetro(c){
  c.fillStyle='#ff3b5c';c.strokeStyle='#ff9ac4';c.lineWidth=1;
  c.beginPath();c.moveTo(-38,-13);c.lineTo(-62,-34);c.lineTo(-54,-13);c.closePath();c.fill();c.stroke();
  c.beginPath();c.moveTo(-38,13);c.lineTo(-62,34);c.lineTo(-54,13);c.closePath();c.fill();c.stroke();
  c.fillStyle='#2a2f45';c.fillRect(-59,-9,9,18);c.fillStyle='#3d4460';c.fillRect(-61,-10,3,20);
  const g=c.createLinearGradient(0,-14,0,14);g.addColorStop(0,'#ffffff');g.addColorStop(.45,'#d2d8e8');g.addColorStop(1,'#6f7896');c.fillStyle=g;retroBody(c);c.fill();
  c.save();retroBody(c);c.clip();c.fillStyle='#ff3b5c';c.fillRect(38,-20,40,40);c.fillStyle='#ff3ea5';c.fillRect(-32,-20,5,40);c.fillRect(-24,-20,2,40);
  c.fillStyle='rgba(255,255,255,.55)';c.fillRect(-48,-10,84,2.4);c.restore();
  c.strokeStyle='#ff3ea5';c.lineWidth=1.3;retroBody(c);c.stroke();
  [[2,0,6.5],[18,0,5]].forEach(([x,y,r])=>{const pg=c.createRadialGradient(x-2,y-2,1,x,y,r);pg.addColorStop(0,'#c8fbff');pg.addColorStop(1,'#1aa6c9');c.fillStyle=pg;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();c.strokeStyle='#2a2f45';c.lineWidth=2;c.stroke()});
}
const ROCKETS={
  candle:{ru:'Зелёная свеча',en:'Green Candle',draw:drawCandle,seat:[-12,-11],tail:-58,trail:'rainbow'},
  retro:{ru:'Ретро-шаттл',en:'Retro Shuttle',draw:drawRetro,seat:[-16,-13],tail:-61,trail:'fire'}
};
function drawFlame(c,kind,power,t,x){
  if(power<=0)return;const L=(22+power*26)*(1+Math.sin(t*50)*.08+Math.random()*.12),W=7+power*3;
  c.save();c.globalCompositeOperation='lighter';
  const g=c.createLinearGradient(x,0,x-L,0);
  if(kind==='fire'){g.addColorStop(0,'#fffbe6');g.addColorStop(.25,'#ffd23f');g.addColorStop(.6,'#ff6a1a');g.addColorStop(1,'rgba(255,40,40,0)')}
  else{g.addColorStop(0,'#fffbe6');g.addColorStop(.3,'#ffd23f');g.addColorStop(.7,'#ff3ea5');g.addColorStop(1,'rgba(41,230,255,0)')}
  c.fillStyle=g;c.beginPath();c.moveTo(x,-W);c.quadraticCurveTo(x-L*.4,-W*1.1,x-L,0);c.quadraticCurveTo(x-L*.4,W*1.1,x,W);c.closePath();c.fill();
  c.fillStyle='rgba(255,255,255,.8)';c.beginPath();c.ellipse(x-4,0,6,W*.45,0,0,6.283);c.fill();c.restore();
}

/* =====================================================================
   Backgrounds (each is a factory so thumbnails get their own instance)
   E = {w,h,sc,dt,t,alt,dAlt,sp,I,phase,m,rx,ry,tx,ty,gy,crashT}
   ===================================================================== */
function candleFeed(){let v=.45,dump=0;return{
  next(){const o=v;let c=o+(dump>0?rnd(-.16,-.04):rnd(-.05,.075));if(dump>0)dump--;if(c>.92)c-=.1;if(c<.06)c=.06+Math.random()*.05;v=c;return{o,c,hi:Math.max(o,c)+rnd(.005,.04),lo:Math.min(o,c)-rnd(.005,.04)}},
  crash(){dump=4}}}
function drawCandles(c,arr,off,top,bot,alpha,step){c.globalAlpha=alpha;arr.forEach((k,i)=>{const x=i*step-off,Y=v=>bot-v*(bot-top),up=k.c>=k.o;c.strokeStyle=c.fillStyle=up?'#2bff88':'#ff3e7a';
  c.lineWidth=1;c.beginPath();c.moveTo(x+step/4,Y(k.hi));c.lineTo(x+step/4,Y(k.lo));c.stroke();const y1=Y(Math.max(k.o,k.c)),y2=Y(Math.min(k.o,k.c));c.fillRect(x,y1,step/2,Math.max(2,y2-y1))});c.globalAlpha=1}

function makeSynth(){
  let w,h,stars=[],city=[],candles=[],feed=candleFeed(),cOff=0,gOff=0;
  return{smoke:'#5d3f86',
    resize(W,H){w=W;h=H;stars=Array.from({length:80},()=>({x:rnd(0,w),y:rnd(0,h),r:rnd(.3,1.4),t:rnd(0,6)}));
      city=[];let x=-6;while(x<w+30){const bw=rnd(12,34);city.push({x,w:bw,h:rnd(.04,.2)*h,win:Array.from({length:6},()=>Math.random()<.4)});x+=bw+rnd(1,4)}
      candles=[];for(let i=0;i<Math.ceil(w/14)+3;i++)candles.push(feed.next())},
    crash(){feed.crash()},
    draw(c,E){const{t,dt,sp,gy}=E;
      const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#090320');g.addColorStop(.55,'#260a4d');g.addColorStop(1,'#5b1269');c.fillStyle=g;c.fillRect(-20,-20,w+40,h+40);

const TG=window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData?window.Telegram.WebApp:null;
const HV={select:10,light:12,medium:20,heavy:35,success:[15,30,15],error:[40,60,120]};
function haptic(kind){try{if(TG&&TG.HapticFeedback){const h=TG.HapticFeedback;if(kind==='select')h.selectionChanged();else if(kind==='success'||kind==='error')h.notificationOccurred(kind);else h.impactOccurred(kind)}
  else if(navigator.userActivation&&navigator.userActivation.hasBeenActive&&navigator.vibrate)navigator.vibrate(HV[kind]||10)}catch(e){}}
function pop(id,txt){const e=$(id);if(txt!=null)e.textContent=txt;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}
function bump(){const b=$('balBox');b.classList.add('bump');clearTimeout(bump.t);bump.t=setTimeout(()=>b.classList.remove('bump'),120)}
function flashVig(col){const v=$('vig');v.style.setProperty('--vig',col);v.classList.add('on');setTimeout(()=>v.classList.remove('on'),220)}
let lastCount=-1;function showCount(txt,go){const e=$('count');e.textContent=txt;e.className='count';void e.offsetWidth;e.className='count on'+(go?' go':'')}
function hue(s){let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))%360;return h}
function renderHist(fresh){$('hist').innerHTML=S.hist.map((c,i)=>`<span class="chip ${c<2?'lo':c<10?'mid':'hi'}${fresh&&i===0?' new':''}">${x2(c)}x</span>`).join('')}
function renderPlayers(){
  const rows=[...S.bots];if(S.bet)rows.unshift({n:T('you'),bet:S.bet.amt,out:S.bet.out,me:true});
  rows.sort((a,b)=>(b.me?1e9:0)-(a.me?1e9:0)||(b.out?1:0)-(a.out?1:0)||b.bet-a.bet);
  set('phL','textContent',T('players')(rows.length));set('phR','textContent',T('pool')(fmtTon(rows.reduce((s,r)=>s+r.bet,0))));
  $('plist').innerHTML=rows.slice(0,3).map(r=>{const st=r.out?'won':S.phase==='crash'?'lost':'';
    const res=r.out?'+'+fmtTon(r.bet*(r.out-1)):S.phase==='crash'?'−'+fmtTon(r.bet):S.phase==='fly'?T('flying'):'—';
    const av=r.me?'linear-gradient(135deg,#ffd23f,#ff3ea5)':`hsl(${hue(r.n)} 55% 45%)`;
    return `<div class="pl ${st}${r.me?' me':''}"><span class="av" style="background:${av}">${(r.me?(lang==='ru'?'Я':'Y'):r.n[0]).toUpperCase()}</span><span class="n">${r.me?r.n:'@'+r.n}</span><span class="b">${fmtTon(r.bet)}</span><span class="r">${res}</span></div>`}).join('')}

function getAmt(){let v=parseFloat(String($('amt').value).replace(',','.'));if(!isFinite(v))v=1;return clamp(v,.1,1000)}
function setAmt(v){$('amt').value=clamp(Math.round(v*100)/100,.1,1000).toFixed(2)}
$('dec').onclick=()=>{const a=getAmt();setAmt(a-(a>1?.5:.1))};$('inc').onclick=()=>{const a=getAmt();setAmt(a+(a>=1?.5:.1))};
$('half').onclick=()=>setAmt(getAmt()/2);$('dbl').onclick=()=>setAmt(getAmt()*2);
$('quick').onclick=e=>{const v=e.target.dataset&&e.target.dataset.v;if(v)setAmt(+v)};$('amt').onchange=()=>setAmt(getAmt());
$('autoOn').onchange=()=>$('autoRow').classList.toggle('off',!$('autoOn').checked);
$('autoX').onchange=()=>{let v=parseFloat($('autoX').value.replace(',','.'));if(!isFinite(v)||v<1.01)v=1.01;$('autoX').value=v.toFixed(2)};
$('topup').onclick=()=>{if(S.bal<1){S.bal=25;toast(T('refill'))}else toast(T('topup'))};
function placeBet(a){if(S.bal<a){toast(T('noFunds'),'bad');return false}S.bal-=a;if(S.phase==='wait')S.bet={amt:a,out:0};else S.next={amt:a};AU.tone(880,.08,'sine',.12);renderPlayers();return true}
$('main').onclick=()=>{unlockAudio();const a=getAmt();
  if(S.phase==='fly'&&S.bet&&!S.bet.out){cashOut(S.m);return}
  if(S.phase==='wait'&&S.bet){S.bal+=S.bet.amt;S.bet=null;renderPlayers();return}
  if(S.phase!=='wait'&&S.next){S.bal+=S.next.amt;S.next=null;return}
  if(placeBet(a))toast(S.phase==='wait'?T('accepted'):T('nextQueued'))};

/* sound */
function unlockAudio(){if(AU.on&&AU.ctx&&AU.ctx.state==='suspended')AU.ctx.resume()}
$('snd').onclick=()=>{AU.init();if(!AU.ctx)return;AU.on=!AU.on;if(AU.on)AU.ctx.resume();else AU.engine(false);$('snd').setAttribute('aria-pressed',AU.on);$('sndW').setAttribute('opacity',AU.on?'1':'.25');if(AU.on)AU.tone(880,.1,'sine',.15)};

/* hangar sheet */
let seg='char';
function openSheet(){$('sheet').classList.add('on');$('scrim').classList.add('on');renderCards()}
function closeSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on')}
$('shClose').onclick=closeSheet;$('scrim').onclick=closeSheet;
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='skins')openSheet();else if(b.dataset.tab!=='game')toast(T('soon'))});
document.querySelectorAll('.segs button').forEach(b=>b.onclick=()=>{seg=b.dataset.seg;document.querySelectorAll('.segs button').forEach(x=>x.setAttribute('aria-selected',x===b));renderCards()});
const LIST={char:CHARS,rocket:ROCKETS,bg:BGS};
function renderCards(){const L=LIST[seg];$('cards').innerHTML=Object.keys(L).map(id=>`<button class="card" data-id="${id}" aria-pressed="${SEL[seg]===id}"><canvas width="180" height="240"></canvas><b>${L[id][lang]}</b><i>${SEL[seg]===id?T('worn'):T('wear')}</i></button>`).join('');
  $('cards').querySelectorAll('.card').forEach(el=>{thumb(el.querySelector('canvas'),seg,el.dataset.id);el.onclick=()=>choose(seg,el.dataset.id)})}
function thumb(cn,kind,id){const c=cn.getContext('2d'),w=90,h=120;c.setTransform(2,0,0,2,0,0);c.clearRect(0,0,w,h);
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,'#1a0b3a');g.addColorStop(1,'#3a0f55');c.fillStyle=g;c.fillRect(0,0,w,h);
  if(kind==='char'){c.save();c.translate(w/2-4,h*.86);c.scale(1.45,1.45);CHARS[id].draw(c,.65,1.3);c.restore()}
  else if(kind==='rocket'){c.save();c.translate(w/2,h/2+6);c.rotate(-.9);c.scale(.52,.52);drawFlame(c,ROCKETS[id].trail,.8,1,ROCKETS[id].tail);ROCKETS[id].draw(c);c.restore()}
  else{const b=BGS[id].make();b.resize(w,h);b.draw(c,{w,h,sc:w/360,dt:0,t:1,alt:0,dAlt:0,sp:1,I:.3,phase:'fly',m:6,moonM:6,rx:w*.5,ry:h*.5,tx:w*.5,ty:h*.55,gy:h*.78})}}
function choose(kind,id){SEL[kind]=id;try{localStorage.setItem('cr.sel',JSON.stringify(SEL))}catch(e){}if(kind==='bg')SC.setBg(id);renderCards();haptic('select')}

function applyLang(){document.documentElement.lang=lang;$('l-ru').setAttribute('aria-pressed',lang==='ru');$('l-en').setAttribute('aria-pressed',lang==='en');
  document.querySelectorAll('[data-i]').forEach(e=>{const v=T(e.dataset.i);if(typeof v==='string')e.textContent=v});for(const kk in cache)delete cache[kk];renderPlayers();if($('sheet').classList.contains('on'))renderCards()}
$('l-ru').onclick=()=>{lang='ru';try{localStorage.setItem('cr.lang',lang)}catch(e){}applyLang()};
$('l-en').onclick=()=>{lang='en';try{localStorage.setItem('cr.lang',lang)}catch(e){}applyLang()};

/* heat colour of the multiplier */
const HEAT=[[1,'#eafff3','rgba(43,255,136,.75)'],[2,'#fff6c2','rgba(255,210,63,.75)'],[5,'#ffd9b0','rgba(255,122,26,.8)'],[10,'#ffd0ea','rgba(255,62,165,.85)'],[25,'#e6f9ff','rgba(41,230,255,.9)']];
function heat(m){let h=HEAT[0];for(const x of HEAT)if(m>=x[0])h=x;return h}

function updateHud(ts){
  const el=(ts-S.t0)/1000;
  set('bal','textContent',fmtTon(Math.max(0,S.bal-S.pend)));set('online','textContent',T('online')(S.online));
  if(S.phase==='wait'){set('mult','textContent','1.00x');set('mult','className','mult waiting');set('sub','textContent',T('startIn')(Math.max(0,WAIT-el).toFixed(1)));
    const left=Math.ceil(WAIT-el);if(left<=3&&left>=1&&left!==lastCount){lastCount=left;showCount(String(left));AU.beep()}}
  else{const mu=$('mult');set('mult','textContent',x2(S.m)+'x');
    const cls='mult'+(S.phase==='crash'?' crashed':'');if(!mu.classList.contains('punch')&&!mu.classList.contains('glitch'))set('mult','className',cls);else{mu.classList.toggle('crashed',S.phase==='crash');mu.classList.remove('waiting')}
    if(S.phase==='fly'){const h=heat(S.m);app.style.setProperty('--heat',h[1]);app.style.setProperty('--heat-glow',h[2])}
    set('sub','textContent',S.phase==='crash'?T('boom')(x2(S.crash)):T('alt')(S.m))}
  let cls='main',b,s='';
  if(S.phase==='fly'&&S.bet&&!S.bet.out){cls+=' cash';b=T('cash');s=fmtTon(S.bet.amt*S.m)+' TON'}
  else if(S.phase==='wait'&&S.bet){cls+=' cancel';b=T('cancel');s=T('accepted')+' · '+fmtTon(S.bet.amt)+' TON'}
  else if(S.phase!=='wait'&&S.next){cls+=' cancel';b=T('cancel');s=T('nextQueued')+' · '+fmtTon(S.next.amt)+' TON'}
  else if(S.phase==='wait'){b=T('bet');s=fmtTon(getAmt())+' TON'}
  else{b=T('betNext');s=fmtTon(getAmt())+' TON'}
  set('main','className',cls);set('mainB','textContent',b);set('mainS','textContent',s)}
$('mult').addEventListener('animationend',e=>e.target.classList.remove('punch','glitch'));

/* =====================================================================
   Loop
   ===================================================================== */
function resize(){const sr=$('stage').getBoundingClientRect(),ar=app.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(1,sr.width);H=Math.max(1,sr.height);AW=Math.max(1,ar.width);AH=Math.max(1,ar.height);OX=sr.left-ar.left;OY=sr.top-ar.top;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);
  fx.width=Math.round(AW*DPR);fx.height=Math.round(AH*DPR);fxc.setTransform(DPR,0,0,DPR,0,0);SC.resize()}
/* =====================================================================
   Telegram Mini App wiring (no-op in a normal browser)
   ===================================================================== */
if(TG){
  document.documentElement.classList.add('tg');
  TG.ready();TG.expand();
  const bg='#12092a';try{TG.setHeaderColor(bg);TG.setBackgroundColor(bg);TG.setBottomBarColor&&TG.setBottomBarColor(bg)}catch(e){}
  if(TG.isVersionAtLeast('7.7'))TG.disableVerticalSwipes();
  if(TG.isVersionAtLeast('8.0')&&/ios|android/.test(TG.platform))try{TG.requestFullscreen()}catch(e){}
  let saved=null;try{saved=localStorage.getItem('cr.lang')}catch(e){}
  const lc=TG.initDataUnsafe&&TG.initDataUnsafe.user&&TG.initDataUnsafe.user.language_code;
  if(!saved&&lc)lang=/^(ru|uk|be|kk)/.test(lc)?'ru':'en';
}
SC.setBg(SEL.bg);new ResizeObserver(resize).observe(app);resize();
applyLang();renderHist();
let last=performance.now();
function tick(ts){
  const dt=Math.min(.05,(ts-last)/1000);last=ts;const el=(ts-S.t0)/1000;
  if(S.phase==='wait'){if(el>=WAIT)startFlight(ts)}
  else if(S.phase==='fly'){S.t=el;const m=Math.exp(K*el);
    if(m>=S.crash)doCrash(ts);
    else{S.m=m;let ch=false;
      if(S.bet&&!S.bet.out){if($('autoOn').checked){const ax=parseFloat($('autoX').value)||2;if(m>=ax)cashOut(ax)}}
      for(const b of S.bots)if(!b.out&&m>=b.target){b.out=b.target;ch=true;SC.onBotCash(b.n,b.target)}
      if(ch)renderPlayers()}}
  else if(S.phase==='crash'&&el>=HOLD)newRound(ts);
  SC.update(dt,ts/1000);
  ctx.clearRect(0,0,W,H);SC.draw(ctx,ts/1000,dt);
  fxc.clearRect(0,0,AW,AH);SC.drawFx(fxc,ts/1000);
  updateHud(ts);requestAnimationFrame(tick)}
requestAnimationFrame(tick);
</script>
