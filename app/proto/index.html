<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Boomy · scene prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700&family=Unbounded:wght@700;800;900&display=swap">
<style>
:root{color-scheme:dark;--bg:#0c0723;--panel:#161a2f;--panel2:#1f2440;--line:#2b3155;--text:#f3f1ff;--muted:#8f93b8;--green:#2bff88;--gold:#ffd23f;--pink:#ff3ea5;--red:#ff3b6b}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#07040f;color:var(--text);font:14px/1.4 'Golos Text',system-ui,sans-serif;overscroll-behavior:none}
.wrap{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
.top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.top b{font:800 15px 'Unbounded',sans-serif;flex:1}
.top a{color:var(--muted);font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 10px}
.stage{position:relative;flex:1;min-height:300px;overflow:clip}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:0;right:0;top:9%;display:flex;flex-direction:column;align-items:center;pointer-events:none}
.mult{font:900 clamp(44px,15vw,64px)/1 'Unbounded',sans-serif;letter-spacing:-.02em;color:#fff;text-shadow:0 0 22px var(--glow,rgba(43,255,136,.7)),0 3px 0 rgba(0,0,0,.35);font-variant-numeric:tabular-nums}
.mult.wait{color:rgba(255,255,255,.35);text-shadow:none}
.mult.boom{color:var(--red);--glow:rgba(255,59,107,.8)}
.mult.punch{animation:punch .5s cubic-bezier(.2,1.7,.4,1)}
.mult.slam{animation:slam .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes punch{0%{transform:scale(1.34)}100%{transform:scale(1)}}
@keyframes slam{0%{transform:scale(1.32) rotate(-3deg)}35%{transform:scale(.94) rotate(1deg)}100%{transform:none}}
.mile{position:absolute;left:0;right:0;top:28%;text-align:center;font:900 30px/1 'Unbounded',sans-serif;color:#fff;text-shadow:0 0 24px rgba(255,255,255,.8);opacity:0;pointer-events:none}
.mile.on{animation:mile 1.1s ease-out forwards}
@keyframes mile{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(1.15) translateY(-10px)}}
.won{position:absolute;left:0;top:0;transform:translate(-50%,-50%);padding:5px 12px;border-radius:99px;background:rgba(10,6,28,.7);border:1.5px solid var(--gold);color:var(--gold);font:800 15px 'Unbounded',sans-serif;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s;font-variant-numeric:tabular-nums}
.won.on{opacity:1}
.sub{margin-top:8px;font-weight:600;font-size:13.5px;color:#e8e2ff;text-shadow:0 1px 6px #000}
.dock{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line)}
.main{height:60px;border:0;border-radius:16px;font:800 17px 'Unbounded',sans-serif;text-transform:uppercase;cursor:pointer;background:var(--gold);color:#1a1204;box-shadow:0 5px 0 #b8901a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.main small{font:700 12px 'Golos Text',sans-serif;text-transform:none;opacity:.8}
.main.cash{background:var(--green);color:#04150d;box-shadow:0 5px 0 #0f9a50,0 0 22px rgba(43,255,136,.45)}
.main[disabled]{background:var(--panel2);color:var(--muted);box-shadow:none;cursor:default}
.row{display:flex;gap:8px}
.row button{flex:1;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:600 13px 'Golos Text',sans-serif;cursor:pointer}
.note{font-size:12px;color:var(--muted);text-align:center}
</style>
<div class="wrap">
  <div class="top"><b>Boomy · прототип сцены</b><a href="../">← в игру</a></div>
  <div class="stage" id="stage"><canvas id="cv"></canvas>
    <div class="hud"><div class="mult wait" id="mult">1.00x</div><div class="sub" id="sub"></div></div>
    <div class="mile" id="mile"></div><div class="won" id="won"></div></div>
  <div class="dock">
    <button class="main" id="main" disabled>Ждём старт<small>&nbsp;</small></button>
    <div class="row"><button id="boom">Взорвать сейчас</button><button id="again">Новый раунд</button></div>
    <div class="note">Прототип новой графики: раунды идут сами. «Забрать» в полёте — катапульта с парашютом.</div>
  </div>
</div>
<script>
/* GitHub Pages lets a browser keep this page for 10 minutes. Ask for the current version past every cache and, if this
   copy is older, reload once with the version in the address (a new address is never served from the cache). The
   bear's pictures carry the version too. */
const PV='10';
(()=>{fetch('ver.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  if(!d||d.v===PV)return;const u=new URL(location.href);if(u.searchParams.get('pv')===d.v)return;u.searchParams.set('pv',d.v);location.replace(u)}).catch(()=>{})})();
</script>
<script src="scene2.js?v=10"></script>
<script>
(()=>{
const $=id=>document.getElementById(id),cv=$('cv'),stage=$('stage'),scene=Scene2.create(cv,{kit:"../art/bear/",ver:PV,onMile:x=>{anim('punch');const e=$('mile');e.textContent='x'+x;e.classList.remove('on');void e.offsetWidth;e.classList.add('on')}});
let fx='',fxT=0;function anim(c){fx=c;fxT=performance.now()+650}   // a one-shot animation class on the multiplier
const NAMES=['crypto_king','whale_99','ivan_kick','moon_boy','degen_anna','hodl_masha','pepe_lord','satoshi_fan','long_x10','ton_tiger','sol_sister','lucky_kate'];
let bots=[],wonAt=0,wonT=0;
const q=new URLSearchParams(location.search),FIX=parseFloat(q.get('x'))||0,AUTO=parseFloat(q.get('auto'))||0;
const K=.12,WAIT=5,HOLD=5;
let phase='wait',t0=performance.now(),m=1,crashAt=2,cashed=false,last=performance.now();
const sample=()=>FIX||Math.min(30,Math.max(1,Math.floor(97/(1-Math.random()))/100));   // the game's distribution, 3% edge
function resize(){const r=stage.getBoundingClientRect();scene.resize(r.width,r.height,window.devicePixelRatio)}
new ResizeObserver(resize).observe(stage);resize();
function newRound(){phase='wait';t0=performance.now();m=1;cashed=false;crashAt=Math.max(1.05,sample());scene.wait();$('won').classList.remove('on');
  // the other players of the round: each bails out at a multiplier of their own
  bots=[...NAMES].sort(()=>Math.random()-.5).slice(0,7).map(n=>({n,x:Math.max(1.08,Math.min(12,.95/(1-Math.random()*.93)))}))}
function cashOut(){if(phase!=='fly'||cashed)return;cashed=true;scene.cashout();wonAt=m;wonT=performance.now();const w=$('won');w.textContent='+'+m.toFixed(2).replace('.',',')+' TON';w.classList.add('on')}
function start(){phase='fly';t0=performance.now();scene.launch()}
function boom(){if(phase!=='fly')return;phase='crash';t0=performance.now();crashAt=m;scene.crash();setTimeout(()=>anim('slam'),380)}
$('main').onclick=cashOut;
$('boom').onclick=boom;$('again').onclick=()=>{newRound()};
const heat=x=>x<2?'rgba(43,255,136,.7)':x<5?'rgba(255,210,63,.75)':x<10?'rgba(255,122,26,.8)':'rgba(255,62,165,.85)';
function tick(now){const dt=(now-last)/1000;last=now;const el=(now-t0)/1000;
  if(phase==='wait'&&el>=WAIT)start();
  else if(phase==='fly'){m=Math.exp(K*el);if(AUTO&&!cashed&&m>=AUTO)cashOut();
    for(const b of bots)if(!b.out&&m>=b.x&&b.x<crashAt){b.out=true;scene.botOut('@'+b.n,b.x.toFixed(2))}
    if(m>=crashAt){m=crashAt;boom()}}
  else if(phase==='crash'&&el>=HOLD)newRound();
  scene.frame(dt,now/1000,m);
  const mu=$('mult'),sub=$('sub'),btn=$('main'),fxc=now<fxT?' '+fx:'';
  // the win floats by the bear under his parachute for a couple of seconds
  {const w=$('won'),j=scene.state.jumper;if(w.classList.contains('on')){if(j&&now-wonT<2600){w.style.left=Math.min(stage.clientWidth-70,Math.max(70,j.x+84))+'px';w.style.top=Math.min(stage.clientHeight-20,Math.max(150,j.y+34))+'px'}else w.classList.remove('on')}}
  if(phase==='wait'){mu.className='mult wait';mu.textContent='1.00x';sub.textContent='Старт через '+Math.max(0,WAIT-el).toFixed(1)+' с';btn.disabled=true;btn.className='main';btn.innerHTML='Ждём старт<small>ставка 1,00 TON</small>'}
  else if(phase==='fly'){mu.className='mult'+fxc;mu.style.setProperty('--glow',heat(m));mu.textContent=m.toFixed(2)+'x';sub.textContent=cashed?'Медведь катапультировался':'Летим!';
    btn.disabled=cashed;btn.className=cashed?'main':'main cash';btn.innerHTML=cashed?'Забрано<small>&nbsp;</small>':'Забрать<small>'+m.toFixed(2).replace('.',',')+' TON</small>'}
  else{mu.className='mult boom'+fxc;mu.textContent=crashAt.toFixed(2)+'x';sub.textContent='Взрыв на '+crashAt.toFixed(2)+'x';btn.disabled=true;btn.className='main';btn.innerHTML='Раунд окончен<small>&nbsp;</small>'}
  requestAnimationFrame(tick)}
newRound();requestAnimationFrame(tick);
})();
</script>
